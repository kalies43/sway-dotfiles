[env]
TERM = "xterm-256color"

[font]
size = 10.0

[font.bold]
family = "DejaVu Sans Mono"
style = "Bold"

[font.bold_italic]
family = "DejaVu Sans Mono"
style = "Bold Italic"

[font.italic]
family = "DejaVu Sans Mono"
style = "Italic"

[font.normal]
family = "DejaVu Sans Mono"
style = "Regular"

[colors.primary]
background = "#15130f"
foreground = "#ece2d0"

[colors.cursor]
text = "#15130f"
cursor = "#c9a04a"

[colors.normal]
black   = "#15130f"
red     = "#7c3f2e"
green   = "#4f7a68"
yellow  = "#c9a04a"
blue    = "#2e3a28"
magenta = "#5c2a1f"
cyan    = "#4f7a68"
white   = "#ece2d0"
